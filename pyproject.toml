[project]
name = "liepin-agent-workbench"
version = "0.1.0"
description = "Desktop Liepin sourcing agent workbench"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0",
    "playwright>=1.45,<2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
