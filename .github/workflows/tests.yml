name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run python -m pytest
